apiVersion: v1
kind: Service

metadata:
  name: {{ include "python-redis.appName" . }}
  labels:
    {{- include "python-redis.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: api

spec:
  type: {{ .Values.app.service.type }}

  selector:
    {{- include "python-redis.appSelectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.app.service.port }}
      targetPort: http
      protocol: TCP