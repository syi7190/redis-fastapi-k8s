apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: redis-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/syi7190/redis-fastapi-k8s
    targetRevision: main
    path: helm/python-redis

    helm:
      releaseName: redis-app

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true